name: bigdata

x-hadoop-config: &hadoop-config
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.replication: 1
  HDFS-SITE.XML_dfs.namenode.name.dir: file:///data/name
  HDFS-SITE.XML_dfs.datanode.data.dir: file:///data/datanode
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.http-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"

services:
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9092:9092"
    environment:
      CLUSTER_ID: big-data-analytics-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ${KAFKA_DATA_DIR:-kafka-data}:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  namenode:
    image: apache/hadoop:3.4.2
    platform: linux/amd64
    restart: unless-stopped
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9870:9870"
    environment:
      <<: *hadoop-config
      # Formats the NameNode only on first start (when the metadata dir does not exist yet).
      ENSURE_NAMENODE_DIR: /data/name/current
    volumes:
      - ${HDFS_NAMENODE_DIR:-hdfs-namenode}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  datanode:
    image: apache/hadoop:3.4.2
    platform: linux/amd64
    restart: unless-stopped
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    environment:
      <<: *hadoop-config
    volumes:
      - ${HDFS_DATANODE_DIR:-hdfs-datanode}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  cassandra:
    image: cassandra:5.0.9
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: big-data-analytics
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: 200M
    volumes:
      - ${CASSANDRA_DATA_DIR:-cassandra-data}:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  mirror-log-generator:
    profiles: [dev]
    build: ./src/mirror_log_generator
    restart: unless-stopped
    # Topics are created by deploy/kafka_init.sh; the producer buffers until they exist.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: cran_mirror_logs
    volumes:
      - ./example_data:/data:ro

volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:
  cassandra-data:
