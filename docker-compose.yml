name: bigdata

x-hadoop-config: &hadoop-config
  CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
  HDFS-SITE.XML_dfs.replication: ${HDFS_REPLICATION:-1}
  HDFS-SITE.XML_dfs.namenode.name.dir: file:///data/name
  HDFS-SITE.XML_dfs.datanode.data.dir: file:///data/datanode
  HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.http-bind-host: 0.0.0.0
  HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
  HDFS-SITE.XML_dfs.permissions.enabled: "false"

x-flink: &flink
  build: ./src/pyflink
  image: bigdata/pyflink:1.20.3
  restart: unless-stopped
  environment: &flink-env
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 3072m
      # The two CRAN jobs take 3 slots each, the GitHub job 1.
      taskmanager.numberOfTaskSlots: 7
      parallelism.default: 3
      state.checkpoints.dir: hdfs://namenode:8020/flink/checkpoints
      # Client-side HDFS setting; keep in sync with dfs.replication in x-hadoop-config.
      flink.hadoop.dfs.replication: ${HDFS_REPLICATION:-1}

# Settings shared by all Spark containers are in src/spark/spark-defaults.conf (baked into
# the image); only the ones that differ between dev and stage/prod are set here.
x-spark: &spark
  build: ./src/spark
  image: bigdata/spark:3.5.8
  restart: unless-stopped
  # tini as PID 1, to reap the processes a worker starts (executors and their Python workers).
  init: true
  environment: &spark-env
    # Heap of the master, worker and history server daemons (default 1 GB).
    SPARK_DAEMON_MEMORY: 512m
    # Client-side HDFS setting, as in FLINK_PROPERTIES; keep in sync with dfs.replication in
    # x-hadoop-config. Passed to every spark-submit (the driver) as a system property,
    # since spark-defaults.conf cannot read variables. Executors get it from the driver.
    SPARK_SUBMIT_OPTS: -Dspark.hadoop.dfs.replication=${HDFS_REPLICATION:-1}

services:
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9092:9092"
    environment:
      CLUSTER_ID: big-data-analytics-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ${KAFKA_DATA_DIR:-kafka-data}:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Schemas are stored in the Kafka topic _schemas (created by deploy/kafka_init.sh),
  # so they persist with the Kafka data and survive restarts.
  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    restart: unless-stopped
    hostname: schema-registry
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8085:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx384m
    healthcheck:
      # The image has python3 but no curl.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  namenode:
    image: apache/hadoop:3.4.2
    platform: linux/amd64
    restart: unless-stopped
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9870:9870"
    environment:
      <<: *hadoop-config
      # Formats the NameNode only on first start (when the metadata dir does not exist yet).
      ENSURE_NAMENODE_DIR: /data/name/current
    volumes:
      - ${HDFS_NAMENODE_DIR:-hdfs-namenode}:/data
    healthcheck:
      # Healthy only once HDFS accepts writes, i.e. safe mode is off. After a restart the
      # NameNode stays in safe mode until the DataNodes have reported their blocks, so the
      # DataNodes must not wait for this check (they depend on service_started).
      test: ["CMD-SHELL", "curl -sf http://localhost:9870/ >/dev/null && hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 30s

  datanode1: &datanode
    image: apache/hadoop:3.4.2
    platform: linux/amd64
    restart: unless-stopped
    hostname: datanode1
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_started
    environment:
      <<: *hadoop-config
    volumes:
      - ${HDFS_DATANODE1_DIR:-hdfs-datanode1}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9864/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  datanode2:
    <<: *datanode
    # Only with the ha profile (stage/prod); dev runs a single DataNode, replication 1.
    profiles: [ha]
    hostname: datanode2
    volumes:
      - ${HDFS_DATANODE2_DIR:-hdfs-datanode2}:/data

  datanode3:
    <<: *datanode
    profiles: [ha]
    hostname: datanode3
    volumes:
      - ${HDFS_DATANODE3_DIR:-hdfs-datanode3}:/data

  jobmanager:
    <<: *flink
    hostname: jobmanager
    command: ["jobmanager"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8081:8081"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  taskmanager:
    <<: *flink
    command: ["taskmanager"]
    depends_on:
      jobmanager:
        condition: service_healthy

  # Submits the job and stays attached; if the job or JobManager dies, the container
  # restarts and resubmits it. Fails until the topic exists (deploy/kafka_init.sh).
  flink-cran-logs-job:
    <<: *flink
    command: ["flink", "run", "-m", "jobmanager:8081", "-py", "/opt/jobs/cran_logs_ingest.py"]
    volumes:
      - ./schemas:/opt/schemas:ro
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      # The jobs write Parquet to HDFS, which needs a live DataNode.
      datanode1:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # Reads cran_mirror_logs_clean, so it needs the topics and schemas from deploy/init.sh.
  flink-cran-package-downloads-job:
    <<: *flink
    command: ["flink", "run", "-m", "jobmanager:8081", "-py", "/opt/jobs/cran_package_downloads.py"]
    volumes:
      - ./schemas:/opt/schemas:ro
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      # The jobs write Parquet to HDFS, which needs a live DataNode.
      datanode1:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # Starts with the poller (--profile github).
  flink-github-events-job:
    <<: *flink
    profiles: [github]
    command: ["flink", "run", "-m", "jobmanager:8081", "-p", "1", "-py", "/opt/jobs/github_events_ingest.py"]
    volumes:
      - ./schemas:/opt/schemas:ro
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  # Spark standalone cluster (batch layer). The workers run the executors. The drivers run
  # in the job containers (spark-submit in client mode: standalone Spark has no cluster
  # deploy mode for Python). The master UI also proxies the worker and application UIs.
  spark-master:
    <<: *spark
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/json/', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Dev runs one worker; the ha profile (stage/prod) adds spark-worker2 and spark-worker3.
  # Cores and memory are what a worker offers to executors (1 core and 1 GB in dev,
  # stage.env and prod.env set 2 and 2g); the worker daemon itself takes up to 512 MB more.
  spark-worker1: &spark-worker
    <<: *spark
    hostname: spark-worker1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker1", "spark://spark-master:7077"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
      # Deletes the work directories (executor logs) of applications that finished more
      # than 7 days ago.
      SPARK_WORKER_OPTS: -Dspark.worker.cleanup.enabled=true
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      # Healthy once registered with the master (masterurl stays empty until then).
      test: ["CMD-SHELL", "python3 -c \"import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8081/json/', timeout=5))['masterurl']\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  spark-worker2:
    <<: *spark-worker
    profiles: [ha]
    hostname: spark-worker2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker2", "spark://spark-master:7077"]

  spark-worker3:
    <<: *spark-worker
    profiles: [ha]
    hostname: spark-worker3
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker3", "spark://spark-master:7077"]

  # Lists finished and running applications from the event logs in HDFS /spark/event-logs.
  # Fails and restarts until that directory exists (deploy/hdfs_init.sh).
  spark-history:
    <<: *spark
    hostname: spark-history
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:18080:18080"
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:18080/api/v1/applications?limit=1', timeout=5)\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Batch jobs (profile spark-jobs): each container runs one spark-submit, i.e. the driver,
  # and exits when the job is done. Run by hand for now:
  #   docker compose --profile spark-jobs run --rm spark-package-daily-downloads
  spark-package-daily-downloads:
    <<: *spark
    profiles: [spark-jobs]
    restart: "no"
    command: ["/opt/spark/bin/spark-submit", "/opt/jobs/package_daily_downloads.py"]
    depends_on:
      spark-worker1:
        condition: service_healthy
      namenode:
        condition: service_healthy
      # The job writes Parquet to HDFS, which needs a live DataNode.
      datanode1:
        condition: service_healthy
      cassandra:
        condition: service_healthy

  cassandra:
    image: cassandra:5.0.9
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: big-data-analytics
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-512M}
      HEAP_NEWSIZE: 200M
    volumes:
      - ${CASSANDRA_DATA_DIR:-cassandra-data}:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # Metadata database of Airflow (DAG runs, task states, users). Not published.
  airflow-postgres:
    image: postgres:16.16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      # Only applied when the data directory is first initialized.
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - ${AIRFLOW_POSTGRES_DIR:-airflow-postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Airflow 3 in one container: the api-server (UI and REST API), the scheduler (which
  # also runs the tasks, as the LocalExecutor is the default), the DAG processor (parses
  # src/airflow/dags) and the triggerer (runs deferrable sensors). If any of them exits,
  # the container exits and Docker restarts it. Before starting them, the image's
  # entrypoint migrates the database and creates the admin user (both idempotent).
  airflow:
    build:
      context: ./src/airflow
      # The image also carries the poller's gh_poller package, for the DAG github_watchlist.
      additional_contexts:
        poller: ./poller
    image: bigdata/airflow:3.4.0
    restart: unless-stopped
    # The GitHub token (from the host shell when set there, else from poller/.env) becomes the
    # Airflow Variable github_token, read from the environment and never stored in the database;
    # the DAG github_watchlist uses it.
    command:
      - bash
      - -c
      - >-
        export AIRFLOW_VAR_GITHUB_TOKEN="$${GITHUB_TOKEN_FROM_SHELL:-$${GITHUB_TOKEN:-}}";
        airflow api-server & airflow scheduler & airflow dag-processor & airflow triggerer & wait -n
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      # The DAGs talk to HDFS (WebHDFS) and Kafka.
      namenode:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # The token and the watch-list build settings (CRANTOGIT_URL, ORG_MIN_R_SHARE, ...) for the DAG
    # github_watchlist; the values under environment take precedence.
    env_file:
      - path: ./poller/.env
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Scan the dags folder for new files every 60 s (default 300 s).
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      # Other keys are generated when the container is created, but this one encrypts
      # connection passwords saved in the database, so it must survive a recreation.
      # Empty (the dev default) stores them unencrypted.
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      # Task logs: uploaded to HDFS when a task finishes, read from there by the UI, and
      # deleted locally, so the container keeps no logs (a running task's log is served
      # from the local file). Only the path of remote_base_log_folder is used; the
      # handler reaches HDFS through the webhdfs_default connection.
      AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
      AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: hdfs://namenode:8020/airflow/logs
      AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: webhdfs_default
      AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "true"
      # Airflow's default log path, except that the colons in the run ID (its timestamp)
      # become dashes: HDFS does not allow ':' in path names.
      AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: 'dag_id={{ ti.dag_id }}/run_id={{ ti.run_id | replace(":", "-") }}/task_id={{ ti.task_id }}/{% if ti.map_index >= 0 %}map_index={{ ti.map_index }}/{% endif %}attempt={{ try_number|default(ti.try_number) }}.log'
      # WebHDFS of the NameNode, for the task logs and for DAGs (WebHDFSHook).
      AIRFLOW_CONN_WEBHDFS_DEFAULT: webhdfs://airflow@namenode:9870
      # Kafka for the DAGs, read from the environment like in the Flink jobs.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # GITHUB_TOKEN of the host shell (e.g. direnv), if any; see command. Not a bare `GITHUB_TOKEN:`
      # passthrough, which would unset the poller/.env value whenever the shell has none.
      GITHUB_TOKEN_FROM_SHELL: ${GITHUB_TOKEN:-}
      # Watch-list size (DAG github_watchlist): dev builds a small one; stage.env and prod.env set 0 (all owners).
      WATCHLIST_MAX_OWNERS: ${POLLER_WATCHLIST_MAX_OWNERS:-100}
    volumes:
      - ./src/airflow/dags:/opt/airflow/dags:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v2/monitor/health >/dev/null && curl -sf http://localhost:8974/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  mirror-log-generator:
    profiles: [dev]
    build: ./src/mirror_log_generator
    restart: unless-stopped
    # Topics are created by deploy/kafka_init.sh; the producer buffers until they exist.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: cran_mirror_logs
    volumes:
      - ./example_data:/data:ro

  # GitHub Events API poller (stream B): every new public event once, as JSON, to the topic
  # github_repo_updates (key: repository name). Needs poller/.env with GITHUB_TOKEN, so it starts
  # only with --profile github. It polls the newest complete watch-list in github_repo_list,
  # published daily by the Airflow DAG github_watchlist, and waits until there is one.
  # State (ETags, seen event ids) lives in POLLER_DATA_DIR.
  github-poller:
    profiles: [github]
    build: ./poller
    image: bigdata/github-poller
    restart: unless-stopped
    # GITHUB_TOKEN from the host shell (e.g. direnv) when set there, else from poller/.env. Also
    # applies to `docker compose run github-poller <command>`. Setting an entrypoint drops the
    # image's CMD, so command repeats it.
    entrypoint: ["sh", "-c", "export GITHUB_TOKEN=\"$${GITHUB_TOKEN_FROM_SHELL:-$${GITHUB_TOKEN:-}}\"; unset GITHUB_TOKEN_FROM_SHELL; exec \"$$@\"", "sh"]
    command: ["python", "-m", "gh_poller"]
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - path: ./poller/.env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: github_repo_updates
      # Not a bare `GITHUB_TOKEN:` passthrough, which would unset the poller/.env value whenever
      # the shell has none; see entrypoint.
      GITHUB_TOKEN_FROM_SHELL: ${GITHUB_TOKEN:-}
      DATA_DIR: /data
      # Used only with WATCHLIST_SOURCE=file in poller/.env (a hand-made list instead of the topic).
      WATCHLIST_PATH: ${POLLER_WATCHLIST_PATH:-/data/watchlist.csv}
      # Daily JSONL copy of the events (input for scripts/check_run.py).
      EVENTS_JSONL: ${POLLER_EVENTS_JSONL:-false}
    volumes:
      - ${POLLER_DATA_DIR:-poller-data}:/data
    healthcheck:
      # Every poll is logged, and tier 1 is polled every 120 s; unhealthy while waiting for a watch-list.
      test: ["CMD-SHELL", "find /data/logs -name 'requests-*.jsonl' -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode1:
  hdfs-datanode2:
  hdfs-datanode3:
  cassandra-data:
  poller-data:
  airflow-postgres:
