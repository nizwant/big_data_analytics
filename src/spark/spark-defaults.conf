# Read by every container of the bigdata/spark image: the master, the workers, the history
# server and the job submitters (which run the driver: standalone Spark has no cluster
# deploy mode for Python, so the driver runs where spark-submit runs).
# Settings that differ between dev and stage/prod come from docker-compose.yml, since
# this file cannot read environment variables.

spark.master                            spark://spark-master:7077

# One executor per core and 1 GB each: a dev worker (1 core, 1 GB) runs one executor,
# a stage/prod worker (2 cores, 2 GB) two. An application takes every free core (FIFO);
# set spark.cores.max on a job to leave room for another.
spark.executor.cores                    1
spark.executor.memory                   1g

spark.hadoop.fs.defaultFS               hdfs://namenode:8020
spark.sql.session.timeZone              UTC

# Event logs in HDFS, read by the history server (spark-history), so finished
# applications stay visible after their driver container is gone.
spark.eventLog.enabled                  true
spark.eventLog.dir                      hdfs://namenode:8020/spark/event-logs
spark.eventLog.compress                 true
spark.history.fs.logDirectory           hdfs://namenode:8020/spark/event-logs
spark.history.fs.cleaner.enabled        true
spark.history.fs.cleaner.maxAge         30d

# The driver's log4j output, uploaded to HDFS while the application runs (one file per
# application). The history server's cleaner above also removes old driver logs.
# Executor logs stay in each worker's work directory: standalone Spark cannot ship them.
spark.driver.log.persistToDfs.enabled   true
spark.driver.log.dfsDir                 hdfs://namenode:8020/spark/driver-logs

# The master UI proxies the worker and application UIs, so only the master's port has to
# be published to browse the whole cluster (workers, executor logs, running jobs).
spark.ui.reverseProxy                   true

spark.cassandra.connection.host         cassandra
spark.sql.extensions                    com.datastax.spark.connector.CassandraSparkExtensions
